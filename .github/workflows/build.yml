name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Icône (rendue depuis l'icône de la PWA)
        run: brew install librsvg xcodegen && rsvg-convert -w 1024 -h 1024 -b '#fa233b' Resources/icon.svg -o Sources/Assets.xcassets/AppIcon.appiconset/icon.png
      - run: xcodegen generate
      - name: Tests (simulateur iPhone)
        run: |
          set -o pipefail
          brew install ffmpeg >/dev/null
          mkdir -p /tmp/music-test
          # MP4 fragmenté comme les fichiers du cache du serveur (DASH)
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=6" -ac 2 -c:a aac -b:a 128k -f mp4 -movflags +frag_keyframe+empty_moov+default_base_moof -frag_duration 1000000 /tmp/music-test/frag.m4a
          UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone [0-9]+ " | grep -oE "[0-9A-F-]{36}")
          xcodebuild test -project LamasMusic.xcodeproj -scheme LamasMusic -destination "id=$UDID" -derivedDataPath build-test CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | xcpretty || { grep -E "error:|failed|XCTAssert|❌" test.log | sort -u | head -60; exit 1; }
      - name: Compilation (sans signature, SideStore/LiveContainer re-signent)
        run: |
          set -o pipefail
          xcodebuild -project LamasMusic.xcodeproj -scheme LamasMusic -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} build 2>&1 | tee build.log | xcpretty || { grep -E 'error:|❌' build.log | sort -u | head -80; exit 1; }
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/LamasMusic.app Payload/
          zip -qry LamasMusic.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: LamasMusic, path: LamasMusic.ipa }
      - name: Publication (release « latest »)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest LamasMusic.ipa -t "Music ${{ github.run_number }}" -n "Build ${{ github.sha }}"
